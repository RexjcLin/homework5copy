<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>歷史溫溼度</title>
    <style>
        body {
            background: #f2f2f2;
            color: #111;
        }

        .page-header {
            background: #111;
            color: #fff;
        }

        .history-card {
            border: 1px solid #d0d0d0;
            border-radius: 0;
        }

        .table thead th {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .table td,
        .table th {
            vertical-align: middle;
            white-space: nowrap;
        }

        .btn-dark,
        .btn-outline-dark {
            border-radius: 0;
        }
    </style>
</head>

<body>
    <header class="page-header py-4 mb-5">
        <div class="container">
            <h1 class="h2 mb-1">歷史溫溼度</h1>
            <p class="mb-0 text-light">查看所有感測器紀錄</p>
        </div>
    </header>
    <main class="container pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-3 mb-md-0">測量紀錄</h2>
            <div><a class="btn btn-dark mr-2" href="{% url 'add_temperature' %}">新增資料</a><a class="btn btn-outline-dark"
                    href="{% url 'show_temperature2' %}">即時監測</a></div>
        </div>
        <div class="card history-card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Sensor ID</th>
                            <th scope="col">溫度</th>
                            <th scope="col">濕度</th>
                            <th scope="col">時間</th>
                        </tr>
                    </thead>
                    <tbody>{% for record in history %}<tr>
                            <td>{{ record.myid }}</td>
                            <td>{{ record.sensor_id }}</td>
                            <td>{{ record.temperature }} °C</td>
                            <td>{{ record.humidity }} %</td>
                            <td>{{ record.timestamp }}</td>
                        </tr>{% empty %}<tr>
                            <td colspan="5" class="text-center py-4">目前沒有歷史資料</td>
                        </tr>{% endfor %}</tbody>
                </table>
            </div>
        </div>
    </main>

</body>

</html>
