<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <title>即時溫溼度顯示</title>
    <!-- <meta http-equiv="refresh" content="10"> -->
    <style>
        body {
            background: #f2f2f2;
            color: #111;
        }

        .page-header {
            background: #111;
            color: #fff;
        }

        .reading-card {
            border: 1px solid #d0d0d0;
            border-radius: 0;
        }

        .reading-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .panel_time {
            border-top: 1px solid #ddd;
        }

        .panel_time p {
            font-weight: bold;
            margin: 0;
        }

        .btn-dark,
        .btn-outline-dark {
            border-radius: 0;
        }
    </style>
    <script>
        $(function () {
            console.log("Document is ready");
            refresh();
            //setInterval(refresh, 10000);
            setInterval(updatePanelTime, 1000);
        });
        function refresh() {
            console.log("Data refreshed");
            $.get("/show_temperature_API", function (data) {
                console.log("Data received:", data);
                if (data.status === "success" && data.data.length > 0) {
                    const latest = data.data[0];
                    $("#temperature").text(latest.temperature);
                    $("#humidity").text(latest.humidity);
                }
            });
        }
        function updatePanelTime() {
            //倒數10秒
            const panel = $(".panel_time p");
            let current = parseInt(panel.text());
            if (current <= 1) {
                refresh();
                current = 10;
            } else {
                current -= 1
            }
            panel.text(current + "秒後更新");
        }

    </script>
</head>

<body>
    <header class="page-header py-4 mb-5">
        <div class="container">
            <h1 class="h2 mb-1">即時溫濕度</h1>
            <p class="mb-0 text-light">自動更新監測畫面</p>
        </div>
    </header>
    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card reading-card shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between border-bottom pb-3 mb-3"><span>目前讀值</span><span
                                class="badge badge-dark">AUTO</span></div>
                        <div class="row">
                            <div class="col-6"><small class="text-muted d-block">目前溫度</small><span id="temperature"
                                    class="reading-value">--</span><span class="ml-1">°C</span></div>
                            <div class="col-6 border-left"><small class="text-muted d-block">目前濕度</small><span
                                    id="humidity" class="reading-value">--</span><span class="ml-1">%</span></div>
                        </div>
                        <div class="panel_time text-center mt-4 pt-3">
                            <p>10秒後更新</p>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4"><a class="btn btn-dark"
                        href="{% url 'show_temperature' %}">一般顯示</a><a class="btn btn-outline-dark"
                        href="{% url 'view_history_temperature' %}">歷史資料</a></div>
            </div>
        </div>
    </main>
</body>

</html>
