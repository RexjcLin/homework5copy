<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <title>新增溫溼度顯示</title>
    <style>
        body {
            background: #f2f2f2;
            color: #111;
        }

        .page-header {
            background: #111;
            color: #fff;
        }

        .form-card {
            border: 1px solid #d0d0d0;
            border-radius: 0;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
        }

        .form-control {
            border-color: #999;
            border-radius: 0;
        }

        .form-control:focus {
            border-color: #111;
            box-shadow: 0 0 0 .2rem rgba(0, 0, 0, .15);
        }

        .btn-dark {
            border-radius: 0;
        }

        .page-link-custom {
            color: #111;
            text-decoration: underline;
        }

        .page-link-custom:hover {
            color: #555;
        }
    </style>
</head>

<body>
    <header class="page-header py-4 mb-5">
        <div class="container">
            <h1 class="h2 mb-2">溫溼度監測</h1>
            <p class="mb-0 text-light">新增感測器測量資料</p>
        </div>
    </header>
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="h4 mb-0">新增溫溼度</h2>
                            <span class="badge badge-dark px-3 py-2">資料輸入</span>
                        </div>
                        <form method="post" action="{% url 'add_temperature' %}">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="sensor_id">Sensor ID</label>
                                <input type="text" class="form-control" id="sensor_id" name="sensor_id" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="temperature">溫度</label>
                                    <div class="input-group">
                                        <input type="number" step="0.01" class="form-control" id="temperature"
                                            name="temperature" required>
                                        <div class="input-group-append"><span class="input-group-text">°C</span></div>
                                    </div>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="humidity">濕度</label>
                                    <div class="input-group">
                                        <input type="number" step="0.01" class="form-control" id="humidity"
                                            name="humidity" required>
                                        <div class="input-group-append"><span class="input-group-text">%</span></div>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-dark btn-block py-2">送出資料</button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a class="page-link-custom" href="{% url 'view_history_temperature' %}">查看歷史溫溼度</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
